name: Secret Scan

# Gitleaks secret scanning for SigmaHelix-OS.
# - On pull requests / pushes to main: scans only the commits introduced by the
#   change (diff vs origin/main), so pre-existing fixtures don't block merges.
# - Weekly (cron): scans the FULL git history, so secrets added in any commit —
#   including before the repo went private — are caught.
#
# The gitleaks binary is pinned to an exact version and verified against a known
# SHA-256 before use. The GitHub Actions used are pinned to commit SHAs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # Monday 03:17 UTC

permissions:
  actions: read          # upload-sarif reads its own workflow run for status reporting
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2, pinned to SHA
        with:
          fetch-depth: 0

      - name: Resolve scan range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "logopts=--all" >> "$GITHUB_OUTPUT"
          else
            base="$(git merge-base HEAD origin/main 2>/dev/null || true)"
            if [ -n "$base" ]; then
              echo "logopts=${base}..HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "logopts=--all" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install gitleaks
        shell: bash
        run: |
          GV=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GV}/gitleaks_${GV}_linux_x64.tar.gz" -o gitleaks.tar.gz
          # Verify integrity before executing.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run gitleaks
        shell: bash
        # --redact ensures no secret value is written to logs or the SARIF file.
        # Syntheric test fixtures are allowlisted in .gitleaks.toml.
        run: |
          ./gitleaks detect \
            --source . \
            --log-opts="${{ steps.range.outputs.logopts }}" \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v3.39.3, pinned to SHA
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
