name: SigmaHelix CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and check dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Check formatting
        run: ruff format --check apps/desktop scripts tests
      - name: Lint
        run: ruff check --select E4,E7,E9,F apps/desktop scripts tests
      - name: Type check
        run: mypy --ignore-missing-imports apps/desktop scripts tests
      - name: Compile
        run: python -m compileall -q apps/desktop scripts tests
      - name: Offline unit tests
        run: python -m pytest apps/desktop/tests/test_e2e_offline.py tests/test_execution_ledger.py -q -p no:cacheprovider
