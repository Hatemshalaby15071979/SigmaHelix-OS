name: SigmaHelix CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check src tests scripts

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          sigmahelix --version
          sigmahelix db info
          sigmahelix audit verify

  package:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  # GOVERNANCE.md section 2: the root holds only the documented set. The gate parses
  # that table out of GOVERNANCE.md, asserts both directions (every named document is
  # present, and no unlisted .md/.txt sits at the root), and self-tests that it fails
  # closed. It needs nothing but python3 and a checkout.
  governance:
    name: root-document hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Root-document hygiene (GOVERNANCE.md section 2)
        run: |
          python3 scripts/check_root_docs.py
          python3 scripts/check_root_docs.py --self-test
