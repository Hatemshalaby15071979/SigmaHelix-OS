[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmahelix"
version = "1.0.0"
description = "Local-first personal operating system: tasks, notes, projects, calendar, launchers and a local LLM assistant."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "SigmaHelix" }]
keywords = ["local-first", "productivity", "sqlite", "ollama", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "customtkinter>=5.2,<7",
    "keyring>=25.0,<26",
]

[project.optional-dependencies]
voice = [
    "SpeechRecognition>=3.10,<4",
    "pyttsx3>=2.90,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff==0.17.4",
    "pyinstaller>=6.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
sigmahelix = "sigmahelix.cli:main"

[project.gui-scripts]
sigmahelix-gui = "sigmahelix.cli:command_gui"

[project.urls]
Homepage = "https://github.com/sigmahelix/sigmahelix"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sigmahelix = [
    "py.typed",
    "skills/builtin/*.md",
    "skills/personal/*.md",
    "skills/personal/*.txt",
    "app/webui/static/*.html",
    "app/webui/static/*.css",
    "app/webui/static/*.js",
]

# ---------------------------------------------------------------------------
# tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:sigmahelix.*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests favour explicitness over terseness: nested context managers show the
# exact statement under test, and narrow try/except blocks document intent.
"tests/**" = ["B011", "SIM105", "SIM117"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/sigmahelix"]
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
show_error_codes = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

# The durable core is fully annotated and checked in strict mode. The desktop
# layer is legacy Tkinter code that is typed incrementally, so strict checks
# would only produce noise there.
[[tool.mypy.overrides]]
module = "sigmahelix.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["sigmahelix.app.*", "sigmahelix.cli"]
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["customtkinter", "pyttsx3", "speech_recognition"]
ignore_missing_imports = true
