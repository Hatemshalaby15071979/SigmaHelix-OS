global_rules:
  - "A claim is either evidenced, attributed, labeled hypothesis, or removed."
  - "E2+ evidence is required for a product claim; E3/E4 for a security or audit claim."
  - "A claim about a customer requires written permission and a reviewed case study."
  - "A market-size claim requires a stated method and sources."
  - "A competitive absolute requires a dated, reproducible comparison."
  - "No timeline or revenue target may be presented as a forecast."
  - "Demo data must be labeled simulated wherever it appears."
  - "When in doubt, remove the claim."

