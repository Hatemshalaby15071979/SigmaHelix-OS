version: 1
project: sigmahelix
gates:
  - id: P0
    name: Truth and safety net
    status: done
    tasks:
      - id: P0-001
        title: Backup workspace to second physical disk with checksum manifest
        status: done
        depends_on: []
        acceptance:
          - "archive exists on /dev/sda2"
          - "sha256 manifest verifies"
          - "restore of 3 sampled files matches byte-for-byte"
        evidence: docs/execution/evidence/P0-001.md
        risk: R1
      - id: P0-002
        title: Initialize sigmahelix git repository and first commit
        status: done
        depends_on: [P0-001]
        acceptance:
          - "git log has the baseline; no secrets, no models, no venvs"
        evidence: docs/execution/evidence/P0-002.md
      - id: P0-003
        title: Import governance and app into the SigmaHelix tree
        status: done
        depends_on: [P0-002]
        acceptance:
          - "Tests pass in the new tree"
        evidence: docs/execution/evidence/P0-003.md
      - id: P0-004
        title: Rename product to SigmaHelix everywhere user-visible
        status: done
        depends_on: [P0-003]
        acceptance:
          - "sigmahelix --version; window title; spec; README"
        evidence: docs/execution/evidence/P0-004.md
      - id: P0-005
        title: Correction notice for stage-2/FINAL_REPORT.md
        status: done
        depends_on: [P0-003]
        acceptance:
          - "Notice file exists; original unedited; index links both"
        evidence: docs/execution/evidence/P0-005.md
      - id: P0-006
        title: Remove or repair stray root .github/ and .env.example
        status: done
        depends_on: [P0-003]
        acceptance:
          - "No CI references a missing path"
        evidence: docs/execution/evidence/P0-006.md
      - id: P0-007
        title: Threat model v1 for SigmaHelix
        status: done
        depends_on: [P0-003]
        acceptance:
          - "STRIDE table + data-flow diagram + 10 abuse cases"
        evidence: docs/execution/evidence/P0-007.md
      - id: P0-008
        title: "CI skeleton: lint, type, unit"
        status: done
        depends_on: [P0-007]
        acceptance:
          - "Green on the baseline commit"
        evidence: docs/execution/evidence/P0-008.md
      - id: P0-009
        title: LEDGER.yaml and runner script
        status: done
        depends_on: [P0-008]
        acceptance:
          - "Runner selects the correct next task"
        evidence: docs/execution/evidence/P0-009.md
      - id: P0-010
        title: Dependency pinning and hash lockfile
        status: done
        depends_on: [P0-009]
        acceptance:
          - "pip install --require-hashes succeeds in a clean venv"
        evidence: docs/execution/evidence/P0-010.md
        risk: R1
  - id: P1
    name: Durable core
    status: done
    tasks:
      - id: P1-001
        title: Domain models for task, note, project, event, approval, and evidence
        status: done
        depends_on: []
        acceptance:
          - "Schema validation tests"
        evidence: docs/execution/evidence/P1-001.md
      - id: P1-002
        title: SQLite connection, WAL pragmas, and repositories
        status: done
        depends_on: [P1-001]
        acceptance:
          - "CRUD round-trip; concurrent read test"
        evidence: docs/execution/evidence/P1-002.md
      - id: P1-003
        title: Migration runner v0 to v1 with rollback
        status: done
        depends_on: [P1-002]
        acceptance:
          - "Forward + rollback tests"
        evidence: docs/execution/evidence/P1-003.md
      - id: P1-004
        title: Config layer with YAML, environment, and keyring
        status: done
        depends_on: [P1-001]
        acceptance:
          - "No hardcoded paths; precedence tests"
        evidence: docs/execution/evidence/P1-004.md
      - id: P1-005
        title: Structured logging and redaction
        status: done
        depends_on: [P1-004]
        acceptance:
          - "Secret-pattern test yields zero leaks"
        evidence: docs/execution/evidence/P1-005.md
      - id: P1-006
        title: Hash-chained audit log
        status: done
        depends_on: [P1-002]
        acceptance:
          - "1,000-event chain verifies; tamper detected"
        evidence: docs/execution/evidence/P1-006.md
      - id: P1-007
        title: Event bus with persistence
        status: done
        depends_on: [P1-002, P1-006]
        acceptance:
          - "Publish/subscribe; replay test"
        evidence: docs/execution/evidence/P1-007.md
      - id: P1-008
        title: Backup, export, and restore commands
        status: done
        depends_on: [P1-002, P1-003]
        acceptance:
          - "Round-trip byte-identical"
        evidence: docs/execution/evidence/P1-008.md
      - id: P1-009
        title: Crash-safety test during write
        status: done
        depends_on: [P1-002]
        acceptance:
          - "WAL recovery; no corruption"
        evidence: docs/execution/evidence/P1-009.md
      - id: P1-010
        title: Import legacy in-memory session when available
        status: done
        depends_on: [P1-001, P1-002]
        acceptance:
          - "Idempotent importer test"
        evidence: docs/execution/evidence/P1-010.md
  - id: P2
    name: Time and projects
    status: in_progress
    tasks:
      - id: P2-001
        title: Recurrence engine for daily, weekly, monthly, weekdays, and every-N rules
        status: done
        depends_on: [P1-001]
        acceptance:
          - "Property tests over 10k generated rules"
        evidence: docs/execution/evidence/P2-001.md
      - id: P2-002
        title: Occurrence materialization and completion semantics
        status: done
        depends_on: [P2-001]
        acceptance:
          - "Completing one occurrence does not kill the series"
        evidence: docs/execution/evidence/P2-002.md
      - id: P2-003
        title: Scheduler with persisted jobs and fake clock
        status: done
        depends_on: [P2-002]
        acceptance:
          - "Fires within 2 seconds in test; no duplicates"
        evidence: docs/execution/evidence/P2-003.md
      - id: P2-004
        title: Missed-run recovery on startup
        status: done
        depends_on: [P2-003]
        acceptance:
          - "Missed alarms surfaced, never silently dropped"
        evidence: docs/execution/evidence/P2-004.md
      - id: P2-005
        title: Notifications with in-app fallback
        status: done
        depends_on: [P2-003]
        acceptance:
          - "Delivery test; no automatic TTS"
        evidence: docs/execution/evidence/P2-005.md
      - id: P2-006
        title: Snooze, dismiss, and reschedule state machine
        status: in_progress
        depends_on: [P2-002, P2-003]
        acceptance:
          - "State machine tests"
        evidence: docs/execution/evidence/P2-006.md
      - id: P2-007
        title: Project scanner for git state, manifests, entrypoints, and health
        status: ready
        depends_on: [P1-002]
        acceptance:
          - "12 repos scanned in under 2 seconds"
        evidence: docs/execution/evidence/P2-007.md
      - id: P2-008
        title: Watch mode with debounce and rescan
        status: ready
        depends_on: [P2-007]
        acceptance:
          - "New repo detected within 5 seconds"
        evidence: docs/execution/evidence/P2-008.md
      - id: P2-009
        title: Launcher profiles, command preview, and run history
        status: ready
        depends_on: [P2-007]
        acceptance:
          - "Unknown command never auto-runs"
        evidence: docs/execution/evidence/P2-009.md
      - id: P2-010
        title: Windows-only artifact labelling
        status: ready
        depends_on: [P2-007]
        acceptance:
          - ".exe marked unsupported on Linux"
        evidence: docs/execution/evidence/P2-010.md
      - id: P2-011
        title: Project health score and new-since-last-scan view
        status: ready
        depends_on: [P2-007]
        acceptance:
          - "Deterministic score tests"
        evidence: docs/execution/evidence/P2-011.md
